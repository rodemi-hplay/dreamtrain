<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>삼척 꿈의 열차</title>
<script src="config.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
/* 근덕역→삼척역 동해선 기차 여행 하나의 세계. 바다색·모래색, 큰 글씨, 큰 버튼, 말풍선 */
:root{
  --sea:#1f6f8b; --sea-deep:#134a5e; --sky:#e4f4fb; --sand:#fff1cf;
  --coral:#ff6b4a; --sun:#ffc93c; --leaf:#2fb36d; --ink:#1c2a38; --paper:#fff; --line:#1c2a38; --muted:#56687a;
  --c-common:#d9dee4; --c-ilban:#cfe8ff; --c-jinro:#ffd9a8; --c-yung:#c9f2d6;
  --display:"Jua","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --body:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--sky);color:var(--ink);font-family:var(--body);font-size:20px;line-height:1.55}
h1,h2,h3,.disp{font-family:var(--display);font-weight:400;text-wrap:balance;margin:0}
button,select,textarea,input{font-family:var(--display);font-size:20px;color:var(--ink)}
button{cursor:pointer}
button:focus-visible,[tabindex]:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:4px solid var(--coral);outline-offset:3px}
#app{max-width:1080px;margin:0 auto;padding:12px 16px 48px}
.topbar{position:sticky;top:0;z-index:5;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;background:var(--sea);color:#fff;border-radius:0 0 18px 18px;padding:8px 12px;margin:-12px -4px 16px;border:3px solid var(--line);border-top:0}
.topbar .who{font-family:var(--display);font-size:20px}
.tb{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.tbtn{background:#fff;color:var(--ink);border:2px solid var(--line);border-radius:12px;padding:4px 10px;font-size:17px}
.clock{background:var(--sun);color:var(--ink);border:2px solid var(--line);border-radius:12px;padding:3px 12px;font-family:var(--display);font-size:22px;font-variant-numeric:tabular-nums;min-width:96px;text-align:center}
.keys{display:flex;gap:4px}
.keyslot{width:32px;height:32px;border-radius:9px;border:2px dashed rgba(255,255,255,.7);display:grid;place-items:center;font-family:var(--display);font-size:18px}
.keyslot.got{background:var(--sun);color:var(--ink);border:2px solid var(--line)}
.card{background:var(--paper);border:3px solid var(--line);border-radius:22px;padding:20px;box-shadow:6px 6px 0 var(--line)}
.btn{background:var(--sun);border:3px solid var(--line);border-radius:16px;padding:12px 22px;box-shadow:4px 4px 0 var(--line);transition:transform .08s}
.btn:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--line)}
.btn.coral{background:var(--coral);color:#fff}.btn.white{background:#fff}.btn.sea{background:var(--sea);color:#fff}
.btn.big{font-size:26px;padding:16px 34px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.between{justify-content:space-between}.center{text-align:center}.cx{justify-content:center}
.stack{display:grid;gap:16px}
.muted{color:var(--muted)}
.say{display:flex;gap:12px;align-items:flex-end}
.say .who{flex:0 0 auto;width:88px}
.bubble{position:relative;background:#fff;border:3px solid var(--line);border-radius:20px;padding:12px 16px;font-size:22px;font-family:var(--display);line-height:1.45}
.bubble::before{content:"";position:absolute;left:-14px;bottom:16px;border:8px solid transparent;border-right:12px solid var(--line)}
.bubble::after{content:"";position:absolute;left:-9px;bottom:18px;border:6px solid transparent;border-right:9px solid #fff}
.bubble.yellow{background:#fff8d6}.bubble.yellow::after{border-right-color:#fff8d6}
.comic{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.panel{position:relative;border:4px solid var(--line);border-radius:14px;overflow:hidden;background:#fff;aspect-ratio:4/3}
.panel svg{display:block;width:100%;height:100%}
.panel .cap{position:absolute;left:8px;top:8px;background:var(--sun);border:2px solid var(--line);border-radius:8px;padding:2px 10px;font-family:var(--display);font-size:16px}
.panel .pb{position:absolute;background:#fff;border:3px solid var(--line);border-radius:16px;padding:6px 12px;font-family:var(--display);font-size:18px;line-height:1.35;max-width:64%}
.panel .boom{position:absolute;font-family:var(--display);color:var(--coral);font-size:42px;-webkit-text-stroke:2px var(--line);transform:rotate(-10deg)}
@media (max-width:620px){.comic{grid-template-columns:1fr}}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.opt{background:#fff;border:3px solid var(--line);border-radius:18px;padding:14px 10px;box-shadow:4px 4px 0 var(--line);display:grid;justify-items:center;gap:6px;font-size:22px;text-align:center}
.opt .ic{font-size:46px;line-height:1}
.opt small{font-family:var(--body);font-size:16px;color:var(--muted)}
.opt.sel{background:#fff3b0}.opt.ok{background:#c9f5d9;border-color:#127a45}.opt.no{background:#ffe0d9;opacity:.6}
.shake{animation:shake .4s}@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.pop{animation:pop .35s}@keyframes pop{0%{transform:scale(.85)}70%{transform:scale(1.06)}100%{transform:scale(1)}}
.float{animation:float 3s ease-in-out infinite}@keyframes float{50%{transform:translateY(-6px)}}
@media (prefers-reduced-motion:reduce){.shake,.pop,.float{animation:none}}
.dots{display:flex;gap:8px;justify-content:center}
.dot{width:14px;height:14px;border-radius:50%;border:2px solid var(--line);background:#fff}.dot.on{background:var(--sun)}.dot.done{background:var(--leaf)}
.reveal{display:grid;gap:8px;background:#effbf3;border:3px solid #127a45;border-radius:18px;padding:14px}
.reveal h3{font-size:26px;color:#0d6a3b}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pill{background:#fff;border:2px solid var(--line);border-radius:999px;padding:2px 12px;font-family:var(--display);font-size:18px}
.subj{border:2px solid var(--line);border-radius:10px;padding:2px 10px;font-family:var(--display);font-size:18px;display:inline-flex;gap:6px;align-items:center}
.subj i{font-style:normal;font-size:13px;border-radius:6px;padding:0 6px;background:rgba(255,255,255,.7);border:1px solid var(--line)}
.s-common{background:var(--c-common)}.s-ilban{background:var(--c-ilban)}.s-jinro{background:var(--c-jinro)}.s-yung{background:var(--c-yung)}
.tabs{display:flex;flex-wrap:wrap;gap:8px}
.tab{border:3px solid var(--line);border-radius:999px;padding:6px 14px;background:#fff;font-size:18px}
.tab[aria-pressed="true"]{background:var(--sun)}
.dex{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.jc{position:relative;border:3px solid var(--line);border-radius:16px;background:#fff;padding:10px 6px;display:grid;justify-items:center;gap:4px;box-shadow:3px 3px 0 var(--line);font-size:18px;text-align:center;min-height:112px}
.jc .ic{font-size:42px;line-height:1}
.jc .local{position:absolute;top:4px;right:6px;font-size:16px}
.jc.seen{background:#f2fbf5}
.jobview{display:grid;grid-template-columns:120px 1fr;gap:14px;align-items:start}
.jobview .big{font-size:84px;text-align:center;background:var(--sky);border:3px solid var(--line);border-radius:20px;line-height:1.3}
@media (max-width:520px){.jobview{grid-template-columns:1fr}}
.kv{display:grid;gap:8px}.kv .k{font-family:var(--display);font-size:18px;color:var(--sea)}
.localbox{background:#e2f6ff;border:2px dashed var(--sea);border-radius:12px;padding:6px 10px;font-family:var(--display)}
.match{display:grid;grid-template-columns:1fr 1fr;gap:12px 18px}.match .col{display:grid;gap:10px}
.mcard{background:#fff;border:3px solid var(--line);border-radius:16px;padding:10px 12px;box-shadow:3px 3px 0 var(--line);display:flex;gap:10px;align-items:center;text-align:left;font-size:21px;min-height:70px}
.mcard .ic{font-size:34px;flex:0 0 auto}.mcard.sel{background:#fff3b0}.mcard.ok{background:#c9f5d9;border-color:#127a45;cursor:default}
.mcard small{display:block;font-family:var(--body);font-size:15px;color:var(--muted)}
.subjopts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.sopt{border:3px solid var(--line);border-radius:16px;padding:12px;box-shadow:3px 3px 0 var(--line);display:grid;gap:4px;text-align:left;font-size:22px}
.sopt small{font-family:var(--body);font-size:15px}.sopt.sel{outline:4px solid var(--coral)}.sopt.ok{outline:4px solid #127a45}
.steps2{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center}
.steps2 .box{border:3px solid var(--line);border-radius:16px;padding:12px;display:grid;gap:4px}
@media (max-width:620px){.steps2{grid-template-columns:1fr}.steps2 .arr{transform:rotate(90deg);justify-self:center}}
.mapwrap{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:760px){.mapwrap{grid-template-columns:1fr}}
.mapwrap svg{width:100%;height:auto;border:3px solid var(--line);border-radius:18px;background:#7cc6ea}
.pin{cursor:pointer}
.place{border:3px solid var(--line);border-radius:14px;padding:10px 12px;background:#fff;display:grid;gap:6px}
.cave{background:linear-gradient(#3a3f4a,#22262e);color:#fff;border-radius:22px;padding:18px;border:3px solid var(--line)}
.cave .bubble{color:var(--ink)}
.rocks{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.rock{width:54px;height:44px;border-radius:40% 40% 20% 20%;background:#6b6f78;border:3px solid #111;display:grid;place-items:center;font-size:22px}
.rock.lit{background:var(--sun)}
.train{border:3px solid var(--line);border-radius:22px;background:linear-gradient(#bfe6ff,#e4f4fb 62%,#ffe1a1 62%,#ffe1a1 70%,#1f6f8b 70%);padding:10px;overflow-x:auto}
.train svg{display:block;min-width:640px;width:100%;height:auto}
.cars{display:grid;gap:12px}
.car{display:grid;grid-template-columns:62px 1fr auto;gap:14px;align-items:center;text-align:left;background:#fff;border:3px solid var(--line);border-radius:18px;padding:12px 16px;box-shadow:4px 4px 0 var(--line)}
.car .ic{font-size:42px;text-align:center}.car .t{font-size:23px}.car .d{font-family:var(--body);font-size:16px;color:var(--muted)}
.car .st{font-size:18px;border-radius:999px;padding:4px 12px;border:2px solid var(--line);white-space:nowrap}
.car.locked{background:#e9eef2;opacity:.7;cursor:not-allowed}.car.done{background:#e3f8eb}
.pad{display:grid;grid-template-columns:repeat(3,80px);gap:10px;justify-content:center}
.pad button{height:68px;font-size:30px;background:#fff;border:3px solid var(--line);border-radius:16px;box-shadow:3px 3px 0 var(--line)}
.screen-code{display:flex;gap:8px;justify-content:center}
.screen-code span{width:58px;height:72px;border:4px solid var(--line);border-radius:14px;background:#14262f;color:#7dffb2;font-family:var(--display);font-size:40px;display:grid;place-items:center}
.modal{position:fixed;inset:0;background:rgba(14,30,48,.6);display:grid;place-items:center;padding:16px;z-index:20;overflow:auto}
.modal .card{max-width:640px;width:100%;max-height:92vh;overflow:auto}
.digit{display:inline-grid;place-items:center;width:92px;height:92px;border-radius:24px;background:var(--sun);border:4px solid var(--line);font-family:var(--display);font-size:60px;box-shadow:5px 5px 0 var(--line)}
textarea{width:100%;min-height:96px;border:3px solid var(--line);border-radius:14px;padding:10px 12px;font-family:var(--body);font-size:21px;resize:vertical}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chipbtn{background:#fff8d6;border:2px solid var(--line);border-radius:999px;padding:4px 12px;font-size:17px}
input[type=text],input[type=password],select{font-size:22px;padding:8px 12px;border:3px solid var(--line);border-radius:14px;background:#fff}
.form{display:grid;grid-template-columns:auto 1fr;gap:10px 12px;align-items:center;max-width:460px}
.hero{display:grid;grid-template-columns:1.1fr 1fr;gap:20px;align-items:center}
@media (max-width:760px){.hero{grid-template-columns:1fr}}
.hero h1{font-size:clamp(40px,7vw,60px);line-height:1.1;color:var(--sea-deep)}
.hero .sub{font-family:var(--display);font-size:22px;color:var(--coral)}
.road{display:grid;gap:8px}
.road .node{display:grid;grid-template-columns:52px 1fr;gap:12px;align-items:center;border:3px solid var(--line);border-radius:16px;padding:10px 12px;background:#fff}
.road .node .ic{font-size:34px;text-align:center}.road .node .k{font-family:var(--display);font-size:17px;color:var(--sea)}
.dream{background:linear-gradient(160deg,#fff 0 62%,#fff3c4 62%);border:4px solid var(--line);border-radius:26px;padding:22px;box-shadow:8px 8px 0 var(--line);display:grid;gap:14px}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 20px;border-radius:14px;font-family:var(--display);font-size:20px;z-index:40;max-width:92vw;text-align:center}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:30;overflow:hidden}
.confetti i{position:absolute;top:-20px;width:12px;height:16px;border-radius:3px;animation:fall 1.6s linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
@media (prefers-reduced-motion:reduce){.confetti{display:none}}
/* 교사 화면 */
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
@media (max-width:700px){.tiles{grid-template-columns:1fr 1fr}}
.tile{border:3px solid var(--line);border-radius:16px;background:#fff;padding:12px 14px}
.tile .n{font-family:var(--display);font-size:40px;line-height:1.1;font-variant-numeric:tabular-nums}
.tile .l{font-size:16px;color:var(--muted)}
.tablewrap{overflow-x:auto;border:3px solid var(--line);border-radius:16px;background:#fff}
table.t{border-collapse:collapse;width:100%;font-size:17px;min-width:760px}
table.t th,table.t td{padding:8px 10px;border-bottom:1px solid #c8d3dc;text-align:left;vertical-align:middle}
table.t th{background:var(--sand);font-family:var(--display);font-weight:400;font-size:17px;position:sticky;top:0}
table.t tr.clk{cursor:pointer}table.t tr.clk:hover{background:#f4fbff}
.prog{display:flex;gap:3px}
.prog span{width:22px;height:14px;border-radius:4px;border:1.5px solid var(--line);background:#fff}
.prog span.on{background:var(--leaf)}.prog span.fin{background:var(--coral)}
.badge{display:inline-block;border:2px solid var(--line);border-radius:999px;padding:0 10px;font-family:var(--display);font-size:15px}
.b-done{background:#c9f5d9}.b-play{background:#fff3b0}.b-idle{background:#e9eef2}.b-re{background:#ffe0d9}
.refls{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.refl{border:3px solid var(--line);border-radius:16px;background:#fff;padding:12px 14px;display:grid;gap:6px}
.refl q{font-size:18px;quotes:none}
.notice{border:3px dashed var(--sea);background:#e2f6ff;border-radius:14px;padding:10px 14px;font-size:17px}
/* 발표 모드 */
.show{position:fixed;inset:0;z-index:50;background:var(--sea-deep);color:#fff;display:grid;grid-template-rows:auto 1fr auto;padding:18px 24px;gap:14px;overflow:auto}
.show .slide{background:#fff;color:var(--ink);border:4px solid var(--line);border-radius:28px;padding:28px 32px;display:grid;gap:16px;align-content:start;box-shadow:10px 10px 0 #0a2a36}
.show .sname{font-family:var(--display);font-size:clamp(28px,4vw,46px)}
.show .sjob{font-family:var(--display);font-size:clamp(22px,3vw,32px);color:var(--sea)}
.show .sq{display:grid;gap:12px}
.show .sq div{font-size:clamp(22px,2.6vw,34px);line-height:1.45;border-left:8px solid var(--sun);padding:4px 0 4px 16px}
.show .sq b{display:block;font-family:var(--display);font-weight:400;font-size:clamp(16px,1.6vw,20px);color:var(--muted)}
.show .talk{background:#fff8d6;border:3px solid var(--line);border-radius:18px;padding:12px 18px;font-family:var(--display);font-size:clamp(20px,2.2vw,28px);color:var(--ink)}
.show .ctrl{display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap}
.show .ctrl .cnt{font-family:var(--display);font-size:24px;min-width:90px;text-align:center}
.count{justify-self:end;font-size:15px;color:var(--muted)}
.freebox{background:#fff8d6;border:3px dashed var(--line);border-radius:16px;padding:14px}
/* 태블릿·휴대폰 화면 */
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
.refls{grid-template-columns:repeat(auto-fill,minmax(min(300px,100%),1fr))}
.modal .card{max-height:92dvh}
.form input{width:100%;min-width:0}
.pill{max-width:100%}
@media (max-width:1024px){
  body{font-size:19px;word-break:keep-all;overflow-wrap:anywhere}
  .tbtn,.chipbtn,.tab{min-height:44px}
  .btn{min-height:48px}
  .chipbtn{text-align:left;border-radius:16px;padding:6px 12px}
  .bubble{font-size:20px}
  .show{padding:14px}
  .show .slide{padding:20px}
}
@media (max-width:620px){
  body{font-size:18px}
  #app{padding:0 10px 32px}
  #app h2{font-size:clamp(23px,6.8vw,28px)!important}
  .topbar{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:6px;margin:0 -4px 12px;padding:6px 8px;border-radius:0 0 14px 14px}
  .topbar .tb{display:contents}
  .topbar .who{grid-area:1/2;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tbtn{min-width:44px;padding:2px 8px;font-size:18px}
  .tbtn .lbl{display:none}
  #tbBack{grid-area:1/1}#tbMusic{grid-area:1/3}#tbRestart{grid-area:1/4}
  .clock{grid-area:2/1/3/3;justify-self:start;min-width:78px;padding:2px 8px;font-size:18px}
  .keys{grid-area:2/3/3/5;justify-self:end;gap:3px}
  .keyslot{width:27px;height:27px;border-radius:7px;font-size:15px}
  .card{padding:14px;border-radius:18px;box-shadow:4px 4px 0 var(--line)}
  .stack{gap:12px}
  .btn{padding:10px 16px;font-size:19px}
  .btn.big{width:100%;font-size:23px;padding:13px 16px}
  .say{gap:8px}.say .who{width:58px}
  .bubble{min-width:0;padding:10px 12px;font-size:18px}
  .hero{gap:12px}.hero h1{font-size:clamp(36px,11vw,46px)}.hero .sub{font-size:19px}
  .hero .row .btn{flex:1 1 100%}
  .form{max-width:none}
  .panel .pb{padding:4px 9px;font-size:15px}.panel .boom{font-size:32px}
  .opts{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
  .opt{padding:10px 6px;font-size:18px;box-shadow:3px 3px 0 var(--line)}.opt .ic{font-size:36px}.opt small{font-size:14px}
  .subjopts{grid-template-columns:1fr}.sopt{font-size:19px}
  .dex{grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
  .jc{min-height:96px;padding:8px 4px;font-size:16px}.jc .ic{font-size:34px}
  .jobview .big{font-size:60px}
  .match{gap:9px}.match .col{gap:8px}
  .mcard{flex-direction:column;justify-content:center;gap:3px;padding:8px 5px;text-align:center;font-size:16px}.mcard .ic{font-size:27px}.mcard small{font-size:13px}
  .train{padding:6px}.train svg{min-width:0}
  .car{grid-template-columns:44px minmax(0,1fr);gap:4px 10px;padding:10px 12px}
  .car .ic{grid-row:span 2;font-size:34px}.car .t{font-size:20px}.car .d{font-size:15px}
  .car .st{grid-column:2;justify-self:start;font-size:15px;padding:2px 10px}
  .pad{grid-template-columns:repeat(3,minmax(0,76px));gap:8px}.pad button{height:60px;font-size:26px}
  .screen-code{gap:5px}.screen-code span{flex:1 1 0;width:auto;max-width:56px;min-width:0;height:62px;font-size:32px}
  .digit{width:76px;height:76px;font-size:48px}
  textarea{font-size:18px;padding:9px 10px}
  input[type=text],input[type=password],select{font-size:19px}
  .chipbtn{font-size:16px}
  .road .node{grid-template-columns:36px minmax(0,1fr);gap:8px;padding:9px}.road .node .ic{font-size:26px}

/* ================================================================

const CFG = window.DREAMTRAIN_CONFIG || {};
const CODE = [3, 1, 5, 8, 2];                 // 1~5칸 열쇠 숫자 = 삼척역 비밀번호
const CLOUD = !!(CFG.FIREBASE && CFG.FIREBASE.apiKey && CFG.FIREBASE.projectId); // Firebase 설정이 있으면 학생 기록을 모아요
const PW_SHA256 = (CFG.LOCAL_TEACHER_PW_SHA256 || "").toLowerCase(); // Firebase 없이 한 기기에서만 쓸 때의 교사 비밀번호 해시
const SDK = "https://www.gstatic.com/firebasejs/10.12.2/";

/* ================================================================
   Firebase: 학생 = 익명 로그인(자기 기록만 쓰기), 교사 = 이메일 계정 + admins 허용 목록
   보안은 firestore.rules 가 서버에서 지켜요
   ================================================================ */
let FB = null;
const fbReady = (async () => {
  if (!CLOUD) return null;
  try {
    const [appM, authM, fsM] = await Promise.all([import(SDK + "firebase-app.js"), import(SDK + "firebase-auth.js"), import(SDK + "firebase-firestore.js")]);
    const app = appM.initializeApp(CFG.FIREBASE);
    const auth = authM.getAuth(app);
    FB = { a: authM, f: fsM, auth, db: fsM.getFirestore(app) };
    await new Promise(ok => { const off = authM.onAuthStateChanged(auth, () => { off(); ok(); }); });
    return FB;
  } catch (e) { console.warn("Firebase를 불러오지 못했어요", e); return null; }
})();
async function studentUser() {
  const fb = await fbReady; if (!fb) return null;
  let u = fb.auth.currentUser;
  if (u && !u.isAnonymous) { await fb.a.signOut(fb.auth); u = null; }
  if (!u) u = (await fb.a.signInAnonymously(fb.auth)).user;
  return u;
}
const LS = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
};
const RUNS_KEY = "sc_dreamtrain_runs", CUR_KEY = "sc_dreamtrain_current";
let saveTimer = null, saving = false, saveAgain = false, saveWarned = false;
function snapshot() {
  return { runId: S.runId, name: String(S.name).slice(0, 20), startedAt: S.startAt, updatedAt: Date.now(),
    elapsedSec: Math.floor(((S.endAt || Date.now()) - S.startAt) / 1000), hints: S.hints, keys: S.keys.filter(Boolean).length,
    roomIdx: S.keys.indexOf(false) === -1 ? 5 : S.keys.indexOf(false), stage: S.stage, done: !!S.submitted, status: S.status,
    values: S.values.map(v => v.label), barrier: S.barrier, light: S.light, dream: S.dream != null ? JOBS[S.dream].name : "",
    dreamIc: S.dream != null ? JOBS[S.dream].ic : "", reflection: { future: (S.refl.future || "").slice(0, 400), learned: (S.refl.learned || "").slice(0, 400), todo: (S.refl.todo || "").slice(0, 400), ...((S.refl.free || "").trim() ? { free: S.refl.free.trim().slice(0, 500) } : {}) } };
}
function save(now) {
  if (!S.runId) return;
  clearTimeout(saveTimer);
  saveTimer = setTimeout(flush, now ? 0 : 1200);
}
async function flush() {
  const snap = snapshot();
  const runs = LS.get(RUNS_KEY, {}); runs[snap.runId] = snap; LS.set(RUNS_KEY, runs);
  LS.set(CUR_KEY, S.submitted ? null : { ...S });
  if (!CLOUD) return;
  if (saving) { saveAgain = true; return; }
  saving = true;
  try {
    const u = await studentUser();
    if (u) await FB.f.setDoc(FB.f.doc(FB.db, "runs", snap.runId), { ...snapshot(), uid: u.uid });
  } catch (e) {
    console.warn("저장 실패", e);
    if (!saveWarned) { saveWarned = true; toast("기록을 보내지 못했어요. 인터넷을 확인하고 선생님께 알려 주세요."); }
  }
  saving = false;
  if (saveAgain) { saveAgain = false; flush(); }
}

async function sha256(t) { try { const b = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(t)); return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, "0")).join(""); } catch (e) { return null; } }
function tlogin() {
  render(`<div class="card stack" style="max-width:520px;margin:30px auto">

        const adm = await fb.f.getDoc(fb.f.doc(fb.db, "admins", cred.user.uid));

      if ((await sha256(pw)) !== PW_SHA256) { err.textContent = "비밀번호가 맞지 않아요."; $("#pw").classList.add("shake"); return; }

    <div class="center"><button class="btn" data-close>닫기</button></div></div>`);
}
const TALK = ["💬 이 친구의 꿈에서 멋진 점은 무엇일까요?", "🙌 이 친구에게 응원 한마디를 해 볼까요?", "🤔 나와 비슷한 점이나 다른 점이 있나요?", "🌊 이 꿈을 삼척에서 이룬다면 어디서 일할 수 있을까요?", "🔦 이 친구가 꿈을 이루려면 어떤 도움이 필요할까요?"];
function present(list) {
  let order = [...list], i = 0, anon = false, talkSec = 0, talkT = null;
  const el = document.createElement("div"); el.className = "show"; el.setAttribute("role", "dialog"); el.setAttribute("aria-label", "소감 발표 모드"); document.body.appendChild(el);
  const draw = () => {
    const r = order[i], who = anon ? `친구 ${i + 1}` : esc(r.name);
    el.innerHTML = `<div class="row between"><span class="disp" style="font-size:24px">🎬 삼척 꿈의 열차 · 미래 소감 나누기</span><div class="row"><button class="tbtn" id="sAnon">${anon ? "🙂 이름 보이기" : "🙈 이름 숨기기"}</button><button class="tbtn" id="sMix">🔀 섞기</button><button class="tbtn" id="sFull">⛶ 전체 화면</button><button class="tbtn" id="sX">✕ 닫기</button></div></div>
      <div class="slide pop"><div class="row between"><span class="sname">${who}</span><span class="sjob">${esc(r.dreamIc)} ${esc(r.dream)}</span></div>
        ${(r.values || []).length ? `<div class="pills">${r.values.map(v => `<span class="pill">${(V(v) || {}).ic || ""} ${esc(v)}</span>`).join("")}</div>` : ""}
        <div class="sq"><div><b>🔭 10년 뒤의 나는…</b>${esc(r.reflection?.future)}</div><div><b>💡 오늘 새로 알게 된 것은…</b>${esc(r.reflection?.learned)}</div><div><b>🏃 꿈을 위해 지금부터 할 일은…</b>${esc(r.reflection?.todo)}</div>${r.reflection?.free ? `<div><b>✍️ 나의 자유 소감</b>${esc(r.reflection.free)}</div>` : ""}</div>
        <div class="talk">${TALK[i % TALK.length]}</div></div>
      <div class="ctrl"><button class="btn white" id="sPrev" ${i ? "" : "disabled"}>◀ 이전</button><span class="cnt">${i + 1} / ${order.length}</span><button class="btn coral" id="sNext" ${i < order.length - 1 ? "" : "disabled"}>다음 ▶</button><button class="btn white" id="sTalk">⏱ 이야기 시간 ${talkT ? fmt(talkSec) : "시작"}</button></div>`;
    $("#sPrev", el).onclick = () => { if (i) { i--; stopTalk(); draw(); } };
    $("#sNext", el).onclick = () => { if (i < order.length - 1) { i++; stopTalk(); draw(); } };
    $("#sAnon", el).onclick = () => { anon = !anon; draw(); };
    $("#sMix", el).onclick = () => { order = shuffle(order); i = 0; stopTalk(); draw(); };
    $("#sFull", el).onclick = () => { try { document.fullscreenElement ? document.exitFullscreen() : el.requestFullscreen(); } catch (e) { toast("전체 화면을 쓸 수 없어요"); } };
    $("#sX", el).onclick = close;
    $("#sTalk", el).onclick = () => { if (talkT) stopTalk(); else { talkSec = 0; talkT = setInterval(() => { talkSec++; const b = $("#sTalk", el); if (b) b.textContent = `⏱ 이야기 시간 ${fmt(talkSec)}`; }, 1000); } draw(); };
  };
  const stopTalk = () => { clearInterval(talkT); talkT = null; };
  const key = e => { if (e.key === "ArrowRight" || e.key === " ") { e.preventDefault(); $("#sNext", el)?.click(); } else if (e.key === "ArrowLeft") $("#sPrev", el)?.click(); else if (e.key === "Escape" && !document.fullscreenElement) close(); };
  const close = () => { stopTalk(); document.removeEventListener("keydown", key); try { if (document.fullscreenElement) document.exitFullscreen(); } catch (e) {} el.remove(); };
  document.addEventListener("keydown", key);
  draw();
}

go("start");
</script>
